name: Release build
on:
  push:
    paths:
      - 'project/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Enable ETC2/ASTC for Android
        working-directory: project
        run: |
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        working-directory: project
        run: godot --headless --import || true

      - name: Export Android APK
        working-directory: project
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/MajnuninArena.apk

      - name: Export Windows
        working-directory: project
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/MajnuninArena.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "مجنونين الساحة - إصدار ${{ github.run_number }}"
          files: |
            project/build/android/MajnuninArena.apk
            project/build/windows/*
